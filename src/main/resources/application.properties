# ===============================
# = Application Info            =
# ===============================
spring.application.name=gurkha-consulting-group-backend
spring.application.version=1.0.0
spring.application.developer=Sabin Dangi

# ===============================
# = Active Profile              =
# ===============================
# Default to 'local' if not specified
# Override with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# = Server Configuration        =
# ===============================
server.port=8080

# ===============================
# = Common JPA Settings         =
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# = Logging                     =
# ===============================
logging.level.com.gurkhaconsultinggroup.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE


