# ===============================
# = LOCAL PROFILE (H2 Database) =
# ===============================
# This profile is used for local development
# Activate with: -Dspring.profiles.active=local or SPRING_PROFILES_ACTIVE=local

# ===============================
# = H2 Datasource Configuration =
# ===============================
spring.datasource.url=jdbc:h2:mem:contactrequestdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# = JPA / Hibernate             =
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# = H2 Console                  =
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# = Logging                     =
# ===============================
logging.level.com.gurkhaconsultinggroup.backend=DEBUG
logging.level.org.springframework.web=DEBUG
