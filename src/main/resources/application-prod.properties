# ===============================
# = PRODUCTION PROFILE          =
# ===============================
# This profile is used for production deployment (Render, etc.)
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod

# ===============================
# = Supabase PostgreSQL Database=
# ===============================
# Use environment variables for security. Fallback values are for reference only.
# In production, set these via environment variables:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / Hibernate             =
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = H2 Console (Disabled)       =
# ===============================
spring.h2.console.enabled=false

# ===============================
# = Logging (Production)        =
# ===============================
logging.level.com.gurkhaconsultinggroup.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=WARN

